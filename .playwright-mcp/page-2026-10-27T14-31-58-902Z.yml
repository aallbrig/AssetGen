          - heading [level=2] [ref=e191]:
            - text: What is assgen?
            - link "¶" [ref=e192] [cursor=pointer]:
              - /url: "#what-is-assgen"
          - paragraph [ref=e193]: assgen is a command-line tool designed for indie game developers and artists who want to leverage AI for asset creation — without cloud costs, without proprietary APIs, and without leaving their terminal.
          - paragraph [ref=e194]: You describe what you want. assgen dispatches the work to a local server that downloads the right model from HuggingFace, runs inference on your GPU, and saves the result.
          - generic [ref=e196]:
