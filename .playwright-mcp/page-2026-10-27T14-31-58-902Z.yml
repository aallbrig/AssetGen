              - generic [ref=e200]: "# Generate a 3D prop"
              - generic [ref=e201]: assgen gen visual model create --prompt "low-poly medieval sword" --wait
              - generic [ref=e203]: "# Generate a sound effect"
              - generic [ref=e204]: assgen gen audio sfx generate "laser gun firing" --wait
              - generic [ref=e206]: "# View all available tasks and their assigned AI models"
              - generic [ref=e207]: assgen tasks
